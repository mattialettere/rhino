# Build Windows 64 bit: compila, esegue i test e pubblica uno zip pronto
# (rhino-ui.exe con interfaccia grafica, cad-console.exe, strumenti .3dm).
name: Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare la Release (file RELEASE)

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # OpenCASCADE via vcpkg: la prima volta ~1 ora, poi dalla cache
      - name: Cache vcpkg (ripristino)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-opencascade-win64-v1
      - name: OpenCASCADE (vcpkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencascade:x64-windows
      - name: Cache vcpkg (salvataggio)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-opencascade-win64-v1

      # Qt 6 precompilato
      - name: Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Configura
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepara lo zip
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\*.exe dist\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\*.dll dist\ -ErrorAction SilentlyContinue
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" dist\ -ErrorAction SilentlyContinue
          if (Test-Path dist\rhino-ui.exe) { windeployqt --release --no-translations dist\rhino-ui.exe }
          # runtime di Visual C++ accanto all'exe: parte anche sui PC senza "VC++ Redistributable"
          foreach ($d in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll') {
            if (Test-Path "C:\Windows\System32\$d") { Copy-Item "C:\Windows\System32\$d" dist\ }
          }
          Copy-Item examples dist\examples -Recurse
          Copy-Item README.md dist\
          Get-ChildItem dist

      - name: Pubblica lo zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhino-windows-x64
          path: dist

      # Checkpoint: quando il file RELEASE contiene una versione nuova (es. v0.1.0) e
      # compilazione e test sono passati sul ramo main, si crea la Release con lo zip.
      # Le versioni gia' pubblicate non vengono toccate.
      - name: Release (versione nel file RELEASE)
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content RELEASE -First 1).Trim()
          if (-not $tag) { exit 0 }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag gia' presente"; exit 0 }
          Compress-Archive -Path dist\* -DestinationPath "rhino-windows-x64-$tag.zip"
          gh release create $tag "rhino-windows-x64-$tag.zip" --target $env:GITHUB_SHA --title "Rhinoceros CAD $tag (Windows 64 bit)" --notes-file docs/RELEASE_NOTES.md

# Compilazione di Kurva3D: Windows 64 bit a ogni push; macOS (Apple Silicon e
# Intel) a mano (Actions -> Build -> Run workflow, "mac" attivo) oppure quando il
# messaggio del commit contiene [mac]: cosi' Windows e Mac escono nella stessa Release.
# Se il file RELEASE contiene una versione nuova si crea la Release; se esiste
# gia' e si e' compilato anche per Mac, i dmg si aggiungono alla Release.
name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      mac:
        description: "Compila anche per Mac e allega i dmg alla release del file RELEASE"
        type: boolean
        default: false
      gguf_url:
        description: "Link a un modello GGUF addestrato (es. Google Drive), oppure 'catalogo' per il modello addestrato di Kurva3D: banco dei 9 oggetti"
        type: string
        default: ""

permissions:
  contents: write   # per pubblicare la Release (file RELEASE)

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # OpenCASCADE via vcpkg: la prima volta ~1 ora, poi dalla cache
      - name: Cache vcpkg (ripristino)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-win64-v2
          # la cache precedente (solo OpenCASCADE) evita di ricompilarlo: si aggiunge Assimp
          restore-keys: |
            vcpkg-opencascade-win64-v1
      - name: OpenCASCADE e Assimp (vcpkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencascade:x64-windows assimp:x64-windows
      - name: Cache vcpkg (salvataggio)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-win64-v2

      # Qt 6 precompilato
      - name: Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          cache: true

      # Python per gli script (RunPythonScript): 3.12.10 e' l'ultima 3.12 con i
      # pacchetti "embeddable" per Windows, quelli che si mettono accanto all'exe
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Configura
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DPython3_ROOT_DIR="$env:pythonLocation" -DPython3_FIND_REGISTRY=NEVER

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          $env:KURVA3D_PYTHONHOME = $env:pythonLocation
          ctest --test-dir build -C Release --output-on-failure

      - name: Prepara lo zip
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\*.exe dist\ -ErrorAction SilentlyContinue
          Copy-Item build\Release\*.dll dist\ -ErrorAction SilentlyContinue
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" dist\ -ErrorAction SilentlyContinue
          if (Test-Path dist\kurva3d.exe) { windeployqt --release --no-translations dist\kurva3d.exe }
          # runtime di Visual C++ accanto all'exe: parte anche sui PC senza "VC++ Redistributable"
          foreach ($d in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll') {
            if (Test-Path "C:\Windows\System32\$d") { Copy-Item "C:\Windows\System32\$d" dist\ }
          }
          Copy-Item examples dist\examples -Recurse
          Copy-Item README.md dist\
          Copy-Item THIRD_PARTY_NOTICES.txt dist\
          Copy-Item EULA.txt dist\
          Copy-Item LICENSE.txt dist\
          Copy-Item licenses dist\licenses -Recurse
          # note di copyright delle librerie installate da vcpkg (OCCT, Qt e dipendenze)
          New-Item -ItemType Directory -Force dist\licenses\vcpkg | Out-Null
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\share\*\copyright" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ("dist\licenses\vcpkg\" + $_.Directory.Name + ".txt") }
          # Python "embeddable" (python.org) accanto all'exe: DLL, libreria standard
          # (python312.zip) e moduli .pyd; stessa versione con cui si e' compilato
          $pyver = python -c "import sys; print('%d.%d.%d' % sys.version_info[:3])"
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyver/python-$pyver-embed-amd64.zip" -OutFile pyembed.zip
          Expand-Archive pyembed.zip -DestinationPath pyembed -Force
          Get-ChildItem pyembed -File | Where-Object { $_.Extension -in '.dll', '.pyd', '.zip' } | ForEach-Object {
            if (-not (Test-Path ("dist\" + $_.Name))) { Copy-Item $_.FullName dist\ }
          }
          Copy-Item pyembed\LICENSE.txt dist\licenses\Python-PSF-LICENSE.txt
          Get-ChildItem dist

      # Motore dell'assistente AI: llama-server di llama.cpp (MIT), versione fissa.
      # Lo zip "vulkan" contiene anche i backend CPU: senza GPU Vulkan usa il processore.
      - name: llama.cpp per l'assistente AI
        shell: pwsh
        run: |
          $tag = 'b12000'
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$tag/llama-$tag-bin-win-vulkan-x64.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\llama.zip"
          Expand-Archive "$env:RUNNER_TEMP\llama.zip" -DestinationPath "$env:RUNNER_TEMP\llama" -Force
          $srv = Get-ChildItem "$env:RUNNER_TEMP\llama" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $srv) { throw "llama-server.exe non trovato nello zip" }
          New-Item -ItemType Directory -Force dist\llama | Out-Null
          Copy-Item "$($srv.DirectoryName)\*" dist\llama\ -Recurse
          Get-ChildItem dist\llama | Format-Table Name, Length

      - name: Cache del modello di prova
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Kurva3D\models
          key: kurva3d-ai-model-qwen3-0.6b-v1

      # Prova completa: licenza e SHA-256 del modello, avvio di llama-server, richiesta e verifica dei comandi
      - name: Prova dell'assistente AI
        shell: pwsh
        timeout-minutes: 25
        run: |
          $env:KURVA3D_LLAMA_SERVER = "$PWD\dist\llama\llama-server.exe"
          & dist\kurva3d-ai-test.exe --model qwen3-0.6b --prompt "un cubo di lato 20 mm con un foro cilindrico di raggio 5 al centro"
          if ($LASTEXITCODE -ne 0) { throw "prova dell'assistente AI fallita" }

      # Esempi per addestrare il modello: generati e verificati uno per uno da Kurva3D
      - name: Verifica degli esempi di addestramento AI
        shell: pwsh
        timeout-minutes: 45
        run: |
          python tools/ai-train/generate_dataset.py --count 3000 --out "$env:RUNNER_TEMP\kurva3d-train.jsonl"
          # uno ogni 5 (stessi modelli di oggetto, misure diverse): la verifica completa richiede ore
          & dist\kurva3d-ai-test.exe --validate-jsonl "$env:RUNNER_TEMP\kurva3d-train.jsonl" --every 5
          if ($LASTEXITCODE -ne 0) { throw "esempi di addestramento non validi" }

      - name: Esempi di addestramento (file)
        uses: actions/upload-artifact@v4
        with:
          name: kurva3d-train-jsonl
          path: ${{ runner.temp }}\kurva3d-train.jsonl

      # Confronto dei modelli (solo se il messaggio del commit contiene [ai-bench]): richieste
      # del banco di prova (tavolo con gamba centrale, sedia, lampada...), con e senza grammatica
      - name: Banco di prova AI (confronto dei modelli)
        if: contains(github.event.head_commit.message, '[ai-bench]')
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 200
        run: |
          $env:KURVA3D_LLAMA_SERVER = "$PWD\dist\llama\llama-server.exe"
          & dist\kurva3d-ai-test.exe --bench --models qwen3-4b,qwen2.5-coder-7b,qwen3-8b

      # Modello addestrato (tools/ai-train): stesso banco, istruzioni brevi; poi Qwen3 4B di
      # base con le istruzioni complete, per il confronto
      - name: Banco di prova AI (modello addestrato)
        if: github.event_name == 'workflow_dispatch' && inputs.gguf_url != ''
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 200
        env:
          GGUF_URL: ${{ inputs.gguf_url }}
        run: |
          $env:KURVA3D_LLAMA_SERVER = "$PWD\dist\llama\llama-server.exe"
          if ($env:GGUF_URL -eq "catalogo") {
            # il modello addestrato del catalogo, scaricato come in Kurva3D (link diretto)
            $model = @("--models", "kurva3d-qwen3-4b")
          } else {
            Write-Output "::add-mask::$env:GGUF_URL"
            python -m pip install -q gdown
            python -m gdown "$env:GGUF_URL" -O "$env:RUNNER_TEMP\kurva3d-finetuned.gguf"
            if ($LASTEXITCODE -ne 0) { throw "download del modello non riuscito" }
            Get-FileHash "$env:RUNNER_TEMP\kurva3d-finetuned.gguf" -Algorithm SHA256 | Format-List
            $model = @("--gguf", "$env:RUNNER_TEMP\kurva3d-finetuned.gguf", "--compact")
          }
          # un processo per richiesta: se uno si ferma, le altre continuano
          foreach ($k in 0..8) {
            & dist\kurva3d-ai-test.exe --bench --case $k @model
            if ($LASTEXITCODE -ne 0) { Write-Output "RICHIESTA ${k}: il programma si e' fermato (codice $LASTEXITCODE)" }
          }
          foreach ($k in 0..8) {
            & dist\kurva3d-ai-test.exe --bench --case $k --models qwen3-4b
            if ($LASTEXITCODE -ne 0) { Write-Output "RICHIESTA ${k}: il programma si e' fermato (codice $LASTEXITCODE)" }
          }

      - name: Togli lo strumento di prova AI dalla distribuzione
        shell: pwsh
        run: Remove-Item dist\kurva3d-ai-test.exe

      # Avvio reale di kurva3d.exe dalla cartella dello zip: script, screenshot e uscita
      - name: Prova dell'interfaccia
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\kurva3d.exe -ArgumentList '--whats-new', '--script', "$PWD\tests\ui_smoke.txt", '--screenshot', "$PWD\dist\screenshot-avvio.png" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "kurva3d.exe non si e' chiuso entro 2 minuti" }
          Write-Host "Codice di uscita: $($p.ExitCode)"
          if (-not (Test-Path dist\screenshot-avvio.png)) { throw "screenshot non creato: la finestra non si e' aperta" }
          Get-Item dist\screenshot-avvio.png | Format-List Name, Length
          if ((Get-Item dist\screenshot-avvio.png).Length -lt 20000) { throw "screenshot troppo piccolo" }

      # Installer (Inno Setup): crea Kurva3D-Setup-<versione>.exe, poi lo prova
      # con un'installazione silenziosa in una cartella temporanea e la disinstalla.
      - name: Prova degli script Python (Python incluso nello zip)
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "*Python*" }) -join ';'
          Remove-Item Env:pythonLocation -ErrorAction SilentlyContinue
          Set-Content -Path pytest.txt -Value '-_RunPythonScript (import rhinoscriptsyntax as rs, json; rs.AddCircle(rs.WorldXYPlane(), 5); print("python-ok", json.dumps(len(rs.AllObjects()))))'
          $out = & dist\cad-console.exe pytest.txt 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'python-ok 1') { throw "lo script Python non e' partito con il Python incluso" }

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup non disponibile" }
          $ver = (Get-Content RELEASE -First 1).Trim().TrimStart('v')
          & $iscc /Qp "/DAppVersion=$ver" "/DSourceDir=$PWD\dist" "/DOutputDir=$PWD\out" installer\kurva3d.iss
          if ($LASTEXITCODE -ne 0) { throw "compilazione dell'installer fallita" }
          $setup = Get-ChildItem out\Kurva3D-Setup-*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\k3d-test"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -PassThru -Wait
          if (-not (Test-Path "$dir\kurva3d.exe")) { throw "installazione silenziosa non riuscita (codice $($p.ExitCode))" }
          if (-not (Test-Path "$dir\EULA.txt")) { throw "EULA non installata" }
          $u = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $u.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Get-Item $setup.FullName | Format-List Name, Length

      - name: Pubblica l'installer
        uses: actions/upload-artifact@v4
        with:
          name: kurva3d-setup
          path: out

      - name: Pubblica lo zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurva3d-windows-x64
          path: dist

  macos:
    if: (github.event_name == 'workflow_dispatch' && inputs.mac) || contains(github.event.head_commit.message, '[mac]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze (Homebrew)
        run: brew install qt opencascade assimp ninja

      # Python per gli script: python-build-standalone (CPython 3.12.10, licenza PSF), relocabile,
      # finisce dentro Kurva3D.app (Frameworks/libpython, Resources/python con la libreria standard)
      - name: Python 3.12 (python-build-standalone)
        run: |
          if [ "${{ matrix.arch }}" = AppleSilicon ]; then a=aarch64; sum=2d6477ecd10191675b7e7979e4b9e811fef36833ef3a7f3aa445eec305ce59a2
          else a=x86_64; sum=d0d51fa22c0e99b58de1b1b4baeca467d6fd0a1424c7509ea280c0796306c481; fi
          curl -fsSL -o "$RUNNER_TEMP/py.tgz" "https://github.com/astral-sh/python-build-standalone/releases/download/20250409/cpython-3.12.10+20250409-$a-apple-darwin-install_only.tar.gz"
          echo "$sum  $RUNNER_TEMP/py.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/py.tgz" -C "$RUNNER_TEMP"
          echo "PBS=$RUNNER_TEMP/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/python/bin/python3" --version
          # il nome d'installazione originale (/install/lib/...) non esiste: si usa il percorso reale
          install_name_tool -id "$RUNNER_TEMP/python/lib/libpython3.12.dylib" "$RUNNER_TEMP/python/lib/libpython3.12.dylib"
          codesign --force -s - "$RUNNER_TEMP/python/lib/libpython3.12.dylib"
          otool -D "$RUNNER_TEMP/python/lib/libpython3.12.dylib"

      - name: Configura
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPython3_ROOT_DIR="$PBS" -DPython3_FIND_FRAMEWORK=NEVER -DPython3_FIND_STRATEGY=LOCATION
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix opencascade);$(brew --prefix assimp)"

      - name: Compila
        run: |
          cmake --build build --parallel
          grep -q "CAD_WITH_PYTHON" build/build.ninja || { echo "Python non trovato dalla configurazione"; exit 1; }

      - name: Test
        run: KURVA3D_PYTHONHOME="$PBS" ctest --test-dir build --output-on-failure

      # App autonoma: framework Qt e librerie OpenCASCADE copiati dentro Kurva3D.app
      - name: Prepara Kurva3D.app
        run: |
          mkdir -p dist
          cp -R build/kurva3d.app dist/Kurva3D.app
          # strumenti a riga di comando, come nello zip per Windows
          cp build/cad-console build/3dm-info dist/Kurva3D.app/Contents/MacOS/
          # Python dentro l'app: libpython in Frameworks, libreria standard in Resources/python
          C=dist/Kurva3D.app/Contents
          mkdir -p "$C/Frameworks" "$C/Resources/python/lib"
          cp "$PBS/lib/libpython3.12.dylib" "$C/Frameworks/"
          install_name_tool -id @executable_path/../Frameworks/libpython3.12.dylib "$C/Frameworks/libpython3.12.dylib"
          old=$(otool -L "$C/MacOS/kurva3d" | awk '/libpython3\.12/{print $1}')
          [ -n "$old" ] || { echo "kurva3d non usa libpython"; exit 1; }
          for exe in kurva3d cad-console 3dm-info; do
            o=$(otool -L "$C/MacOS/$exe" | awk '/libpython3\.12/{print $1}')
            [ -z "$o" ] || install_name_tool -change "$o" @executable_path/../Frameworks/libpython3.12.dylib "$C/MacOS/$exe"
          done
          rsync -a --exclude test --exclude idlelib --exclude tkinter --exclude turtledemo --exclude ensurepip \
            --exclude site-packages --exclude '__pycache__' --exclude '_tkinter*' --exclude 'config-3.12-*' \
            "$PBS/lib/python3.12" "$C/Resources/python/lib/"
          mkdir -p "$C/Resources/python/lib/python3.12/site-packages"
          du -sh "$C/Resources/python"
          "$(brew --prefix qt)/bin/macdeployqt" dist/Kurva3D.app -always-overwrite \
            -executable=dist/Kurva3D.app/Contents/MacOS/cad-console -executable=dist/Kurva3D.app/Contents/MacOS/3dm-info
          R=dist/Kurva3D.app/Contents/Resources
          cp EULA.txt LICENSE.txt THIRD_PARTY_NOTICES.txt README.md "$R/"
          cp -R examples "$R/examples"
          cp -R licenses "$R/licenses"
          cp "$PBS/lib/python3.12/LICENSE.txt" "$R/licenses/Python-PSF-LICENSE.txt"
          # nessuna libreria deve restare collegata a Homebrew
          bad=0
          while IFS= read -r f; do
            # (la prima riga di una dylib e' il suo nome di installazione: non conta)
            if otool -L "$f" 2>/dev/null | tail -n +2 | grep -v "/$(basename "$f") (" | grep -E "/opt/homebrew|/usr/local" ; then echo "^ in $f"; bad=1; fi
          done < <(find dist/Kurva3D.app -type f \( -perm -111 -o -name "*.dylib" \))
          if [ $bad -ne 0 ]; then echo "librerie esterne non incluse"; exit 1; fi
          du -sh dist/Kurva3D.app

      # Motore dell'assistente AI: llama-server di llama.cpp (MIT) per macOS, versione fissa
      # (Metal su Apple Silicon). Va in Contents/Helpers/llama, firmato con l'app.
      - name: llama.cpp per l'assistente AI
        run: |
          tag=b12000
          arch=${{ matrix.arch == 'AppleSilicon' && 'arm64' || 'x64' }}
          mkdir -p "$RUNNER_TEMP/llama"
          ok=0
          for ext in tar.gz zip; do
            url="https://github.com/ggml-org/llama.cpp/releases/download/$tag/llama-$tag-bin-macos-$arch.$ext"
            if curl -fsSL "$url" -o "$RUNNER_TEMP/llama.$ext"; then
              if [ $ext = zip ]; then unzip -q "$RUNNER_TEMP/llama.zip" -d "$RUNNER_TEMP/llama"; else tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/llama"; fi
              ok=1; break
            fi
          done
          [ $ok = 1 ] || { echo "llama.cpp per macOS non scaricato"; exit 1; }
          srv=$(find "$RUNNER_TEMP/llama" -type f -name llama-server | head -1)
          [ -n "$srv" ] || { echo "llama-server non trovato nell'archivio"; exit 1; }
          H=dist/Kurva3D.app/Contents/Helpers/llama
          mkdir -p "$H"
          cp -R "$(dirname "$srv")"/* "$H/"
          chmod +x "$H/llama-server"
          xattr -cr "$H" || true
          ls -la "$H"
          # le librerie devono essere quelle accanto a llama-server, non di Homebrew
          if otool -L "$H/llama-server" | grep -E "/opt/homebrew|/usr/local"; then echo "llama-server usa librerie esterne"; exit 1; fi

      - name: Cache del modello di prova
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Kurva3D/models
          key: kurva3d-ai-model-mac-qwen3-0.6b-v1

      # Prova completa dell'assistente con il llama-server impacchettato
      - name: Prova dell'assistente AI
        timeout-minutes: 25
        run: |
          KURVA3D_LLAMA_SERVER="$PWD/dist/Kurva3D.app/Contents/Helpers/llama/llama-server" \
            build/kurva3d-ai-test --model qwen3-0.6b --prompt "un cubo di lato 20 mm con un foro cilindrico di raggio 5 al centro"

      - name: Firma
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            KC="$RUNNER_TEMP/firma.keychain-db"; KP="$(uuidgen)"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KP" "$KC"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')
            if [ -z "$ID" ]; then echo "certificato Developer ID Application non trovato"; exit 1; fi
            # prima gli eseguibili e le librerie di llama.cpp e i moduli di Python (non coperti da --deep)
            find dist/Kurva3D.app/Contents/Helpers dist/Kurva3D.app/Contents/Resources/python dist/Kurva3D.app/Contents/MacOS/cad-console dist/Kurva3D.app/Contents/MacOS/3dm-info -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -exec \
              codesign --force --options runtime --timestamp --entitlements res/entitlements.plist -s "$ID" {} \;
            codesign --force --deep --options runtime --timestamp --entitlements res/entitlements.plist -s "$ID" dist/Kurva3D.app
            echo "FIRMATA=1" >> "$GITHUB_ENV"
          else
            echo "Nessun certificato nei Secrets: firma ad hoc (app non firmata da Apple)"
            find dist/Kurva3D.app/Contents/Helpers dist/Kurva3D.app/Contents/Resources/python dist/Kurva3D.app/Contents/MacOS/cad-console dist/Kurva3D.app/Contents/MacOS/3dm-info -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -exec codesign --force -s - {} \;
            codesign --force --deep -s - dist/Kurva3D.app
          fi
          codesign --verify --deep --strict --verbose=2 dist/Kurva3D.app

      # Avvio reale dell'app impacchettata: script, screenshot e uscita
      - name: Prova dell'interfaccia
        run: |
          ( dist/Kurva3D.app/Contents/MacOS/kurva3d --whats-new --script "$PWD/tests/ui_smoke.txt" --screenshot "$PWD/screenshot-mac.png" & echo $! > pid )
          for i in $(seq 1 120); do kill -0 $(cat pid) 2>/dev/null || break; sleep 1; done
          if kill -0 $(cat pid) 2>/dev/null; then kill $(cat pid); echo "l'app non si e' chiusa entro 2 minuti"; exit 1; fi
          test -s screenshot-mac.png || { echo "screenshot non creato"; exit 1; }
          ls -la screenshot-mac.png

      # Apertura di un DXF con quote e testi (annotazioni vere, nel carattere del file)
      - name: Prova di apertura DXF
        run: |
          printf '%s\n' "_Open \"$PWD/tests/exchange_files/completo_r2018.dxf\"" > dxf.txt
          ( dist/Kurva3D.app/Contents/MacOS/kurva3d --no-whats-new --script "$PWD/dxf.txt" --screenshot "$PWD/screenshot-mac-dxf.png" --wait 1500 & echo $! > pid )
          for i in $(seq 1 120); do kill -0 $(cat pid) 2>/dev/null || break; sleep 1; done
          if kill -0 $(cat pid) 2>/dev/null; then kill $(cat pid); echo "l'app non si e' chiusa entro 2 minuti"; exit 1; fi
          test -s screenshot-mac-dxf.png || { echo "screenshot DXF non creato"; exit 1; }

      # Script Python con il Python dentro l'app (quello scaricato viene tolto di mezzo)
      - name: Prova degli script Python (Python incluso nell'app)
        run: |
          mv "$PBS" "$PBS.via"
          rm -f "$RUNNER_TEMP/py-ok.txt"
          printf '%s\n' "-_RunPythonScript (import rhinoscriptsyntax as rs, json; rs.AddCircle(rs.WorldXYPlane(), 5); open('$RUNNER_TEMP/py-ok.txt', 'w').write('python-ok ' + json.dumps(len(rs.AllObjects()))))" > pytest.txt
          ( env -u KURVA3D_PYTHONHOME dist/Kurva3D.app/Contents/MacOS/kurva3d --script "$PWD/pytest.txt" --screenshot "$RUNNER_TEMP/py.png" & echo $! > pid )
          for i in $(seq 1 120); do kill -0 $(cat pid) 2>/dev/null || break; sleep 1; done
          kill $(cat pid) 2>/dev/null || true
          cat "$RUNNER_TEMP/py-ok.txt" || true
          grep -q "python-ok 1" "$RUNNER_TEMP/py-ok.txt" || { mv "$PBS.via" "$PBS"; echo "lo script Python non e' partito con il Python dell'app"; exit 1; }
          # anche cad-console dentro l'app (come la prova su Windows)
          printf '%s\n' '-_RunPythonScript (import rhinoscriptsyntax as rs, json; rs.AddCircle(rs.WorldXYPlane(), 5); print("python-ok", json.dumps(len(rs.AllObjects()))))' > pytest2.txt
          out=$(env -u KURVA3D_PYTHONHOME dist/Kurva3D.app/Contents/MacOS/cad-console pytest2.txt 2>&1 || true)
          mv "$PBS.via" "$PBS"
          echo "$out"
          echo "$out" | grep -q "python-ok 1" || { echo "cad-console: Python dell'app non partito"; exit 1; }

      - name: Crea il dmg
        run: |
          VER=$(head -1 RELEASE | tr -d '[:space:]' | sed 's/^v//')
          DMG="Kurva3D-$VER-mac-${{ matrix.arch }}.dmg"
          mkdir -p dmg out
          cp -R dist/Kurva3D.app dmg/
          ln -s /Applications dmg/Applicazioni
          cp EULA.txt "dmg/Licenza d'uso.txt"
          cp -R examples dmg/Esempi
          hdiutil create -volname "Kurva3D $VER" -srcfolder dmg -ov -format UDZO "out/$DMG"
          echo "DMG=out/$DMG" >> "$GITHUB_ENV"

      - name: Notarizzazione Apple
        if: env.FIRMATA == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ID=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --force --timestamp -s "$ID" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m | tee notary.txt
          grep -q "status: Accepted" notary.txt || { echo "notarizzazione rifiutata"; exit 1; }
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - name: Pubblica il dmg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurva3d-mac-${{ matrix.arch }}
          path: |
            out
            screenshot-mac.png
            screenshot-mac-dxf.png

  # Checkpoint: quando il file RELEASE contiene una versione nuova (es. v0.7.0) e
  # tutte le compilazioni e i test sono passati sul ramo main, si crea la Release.
  # Le versioni gia' pubblicate non vengono toccate.
  release:
    needs: [windows, macos]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.windows.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Release (versione nel file RELEASE)
        run: |
          shopt -s nullglob
          tag=$(head -1 RELEASE | tr -d '[:space:]')
          [ -n "$tag" ] || exit 0
          dmgs=(art/kurva3d-mac-*/out/*.dmg)
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              if [ ${#dmgs[@]} -gt 0 ]; then
                gh release upload "$tag" "${dmgs[@]}" --clobber
                gh release edit "$tag" --title "Kurva3D $tag" --notes-file docs/RELEASE_NOTES.md
                echo "dmg aggiunti alla release $tag"
              else
                echo "Release $tag gia' presente"
              fi
              exit 0
            fi
            gh release delete "$tag" --yes   # bozza rimasta da un'esecuzione interrotta
          fi
          (cd art/kurva3d-windows-x64 && zip -qr "$GITHUB_WORKSPACE/kurva3d-windows-x64-$tag.zip" .)
          files=("kurva3d-windows-x64-$tag.zip" art/kurva3d-setup/Kurva3D-Setup-*.exe "${dmgs[@]}")
          ls -la "${files[@]}"
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Kurva3D $tag" --notes-file docs/RELEASE_NOTES.md
